<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b16">
<title>Quem é o Impostor?</title>
<style>
:root {
  --bg:#080b16; --panel:#11182a; --panel2:#1a2540;
  --text:#f5f7ff; --muted:#a4b0cb; --accent:#9275ff;
  --green:#43e6ad; --red:#ff637d; --border:#34415f80;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; padding:16px 12px 36px;
  color:var(--text); font-family:Inter,system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(ellipse at 10% 0%,#30245c 0,transparent 38%),
    radial-gradient(ellipse at 100% 30%,#102e4b 0,transparent 35%),
    var(--bg);
}
#app { max-width:720px; margin:auto; }
header { text-align:center; padding:16px 0 25px; }
.logo {
  display:inline-grid; place-items:center; width:74px; height:74px;
  border-radius:25px; font-size:37px;
  background:linear-gradient(135deg,#ad99ff,#6650ed 60%,#4d9bff);
  box-shadow:0 0 45px #8166ff40; border:1px solid #ffffff30;
}
h1 { font-size:clamp(27px,6vw,42px); letter-spacing:-1.5px; margin:14px 0 5px; font-weight:950; }
.subtitle { color:var(--muted); margin:0; }
.panel {
  background:linear-gradient(145deg,#151e34f5,#0e1527f5);
  border:1px solid var(--border); border-radius:23px;
  padding:21px; margin-bottom:15px; box-shadow:0 18px 55px #0003;
}
h2 { font-size:25px; letter-spacing:-.6px; margin:12px 0; }
h3 { margin:0 0 10px; }
label { display:block; font-weight:750; margin:15px 0 8px; }
input,textarea,select {
  width:100%; background:#0a1020; color:var(--text);
  border:1px solid #34415f; border-radius:14px; padding:13px;
  font:inherit; outline:none; transition:border-color .2s,box-shadow .2s;
}
input:focus,textarea:focus,select:focus {
  border-color:var(--accent); box-shadow:0 0 0 3px #9275ff20;
}
textarea { min-height:140px; resize:vertical; }
button {
  border:1px solid transparent; border-radius:14px; padding:13px 16px;
  font:inherit; font-weight:800; cursor:pointer;
  transition:transform .15s,filter .15s;
}
button:hover { filter:brightness(1.08); }
button:active { transform:scale(.98); }
button:disabled { opacity:.35; cursor:not-allowed; }
.primary {
  width:100%; margin-top:15px; color:white;
  background:linear-gradient(110deg,#8268ff,#5d70f5);
  box-shadow:0 8px 25px #705cff30;
}
.success { width:100%; margin-top:15px; color:#05281e; background:linear-gradient(110deg,#55f0ba,#38dca5); }
.secondary { color:var(--text); background:var(--panel2); border-color:var(--border); }
.danger { color:#ffdce3; background:#3a1a2a; border-color:#9c3b57; }
.small { padding:9px 12px; font-size:13px; }
.top-actions { display:flex; justify-content:flex-end; margin-bottom:12px; }
.sound-controls {
  position: static;
  display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center;
  align-items: center; gap: 8px; margin: 0 auto 18px;
}
.sound-toggle {
  position: relative;
  padding: 10px 13px;
  border-radius: 30px;
  color: white;
  background: #1a2540;
  border: 1px solid #9275ff80;
  box-shadow: 0 0 18px #9275ff20;
  font-size: 13px;
}
.volume-control {
  display: block; margin: 0; padding: 9px 12px; width: min(240px, 100%);
  color: white; background: #1a2540; border: 1px solid #9275ff80;
  border-radius: 14px; font-size: 12px; box-shadow: 0 0 18px #9275ff20;
}
.volume-control span { display:flex; justify-content:space-between; gap:8px; }
.volume-control input { width:100%; padding:0; margin:8px 0 0; accent-color:#9275ff; }
.badge {
  display:inline-flex; align-items:center; gap:6px; padding:7px 11px;
  border-radius:999px; background:#8c75ff1c; color:#c9bdff;
  border:1px solid #9c89ff35; font-size:11px; font-weight:900; letter-spacing:1px;
}
.muted { color:var(--muted); line-height:1.65; }
.notice {
  padding:14px; margin:13px 0; border-radius:15px;
  background:#0a1122; border:1px solid var(--border); line-height:1.6;
}
.grid { display:grid; grid-template-columns:1fr 1fr; gap:13px; }
.card-secret {
  margin-top:18px; padding:22px; text-align:center; border-radius:21px;
  background:linear-gradient(145deg,#292452,#121d38);
  border:1px solid #8e7bff80; box-shadow:inset 0 0 35px #8673ff0b;
}
.secret { margin:14px 0; font-size:clamp(26px,6vw,38px); font-weight:950; letter-spacing:-.8px; overflow-wrap:anywhere; }
.player-row,.vote-row {
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:13px 2px; border-bottom:1px solid var(--border);
}
.player-row:last-child,.vote-row:last-child { border-bottom:0; }
.vote-row label { display:flex; align-items:center; gap:12px; flex:1; margin:0; cursor:pointer; }
.vote-row input { width:19px; height:19px; accent-color:var(--accent); }
.pill {
  flex-shrink:0; padding:6px 10px; border-radius:999px; font-size:12px;
  font-weight:800; background:#27334e; color:#d9e2ff;
}
.hidden { display:none !important; }
.footer-note { text-align:center; font-size:12px; color:var(--muted); margin-top:13px; }
@media(max-width:480px) {
  body { padding:10px 10px 28px; }
  header { padding-top:12px; }
  .panel { padding:17px; border-radius:20px; }
  .grid { grid-template-columns:1fr; gap:2px; }
  button { min-height:46px; }
}

/* Cronômetro da fase de perguntas */
.timer-card { margin:16px 0; padding:18px; border:1px solid #43e6ad60; border-radius:18px; text-align:center; background:linear-gradient(145deg,#102e35,#101a2b); }
.timer-display { font-size:clamp(38px,10vw,54px); line-height:1.15; font-weight:950; font-variant-numeric:tabular-nums; letter-spacing:2px; margin:8px 0 14px; }
.timer-controls { display:flex; gap:9px; justify-content:center; flex-wrap:wrap; }
.timer-controls button { flex:1; min-width:105px; }
.timer-status { color:var(--muted); font-size:13px; margin:0 0 12px; }
.timer-display.time-up { color:var(--red); animation:pulseReveal .8s ease-in-out infinite alternate; }

/* Perguntas rápidas e revelação cinematográfica */
.question-card {
  margin:18px 0; padding:20px; text-align:center; border-radius:20px;
  background:radial-gradient(ellipse at top,#382d70,#11182a 75%);
  border:1px solid #9b86ff80; box-shadow:0 0 30px #8166ff18;
}
.question-label { color:#c9bdff; font-size:11px; font-weight:900; letter-spacing:1.5px; }
.question-text { margin:12px 0 8px; font-size:clamp(20px,5vw,27px); font-weight:900; line-height:1.25; }
.question-tip { color:var(--muted); font-size:13px; margin:0; }
#roleReveal { overflow:hidden; position:relative; }
.reveal-intro { color:#c9bdff; font-weight:900; letter-spacing:2px; animation:pulseReveal 1s ease-in-out infinite alternate; }
#roleReveal .reveal-role-text { opacity:0; transform:scale(.72); filter:blur(8px); }
#roleReveal.revealed .reveal-role-text { animation:cinematicReveal .8s cubic-bezier(.16,1,.3,1) forwards; }
#roleReveal.revealed { animation:revealGlow 1.2s ease-out; }
@keyframes cinematicReveal {
  0% { opacity:0; transform:scale(.72); filter:blur(8px); letter-spacing:5px; }
  65% { opacity:1; transform:scale(1.08); filter:blur(0); }
  100% { opacity:1; transform:scale(1); filter:blur(0); letter-spacing:normal; }
}
@keyframes pulseReveal { from { opacity:.45; } to { opacity:1; text-shadow:0 0 18px #a997ff; } }
@keyframes revealGlow { 0% { box-shadow:0 0 0 #9275ff00; } 45% { box-shadow:0 0 55px #9275ff80; } 100% { box-shadow:0 0 25px #9275ff20; } }
@media (prefers-reduced-motion: reduce) {
  .reveal-intro, #roleReveal.revealed, #roleReveal.revealed .reveal-role-text { animation:none !important; }
  #roleReveal .reveal-role-text { opacity:1; transform:none; filter:none; }
}

</style>
</head>

<div id="app">
  <header>
    <div class="logo">🕵️</div>
    <h1>QUEM É O IMPOSTOR?</h1>

  <div class="sound-controls">
    <button id="soundToggle" class="sound-toggle" type="button">🔊 Som ligado</button>
    <label class="volume-control" for="soundVolume">
      <span>🔉 Volume <strong id="volumeValue">100%</strong></span>
      <input id="soundVolume" type="range" min="0" max="100" step="5" value="100" aria-label="Volume dos efeitos sonoros">
    </label>
  </div>
  <main id="gameContent"></main>
</div>
<audio id="backgroundMusic" src="trilha-suspense.m4a" loop preload="auto"></audio>
<audio id="revealEffect" src="cinematic-boom-suspense-reveal-bass.mp3" preload="auto"></audio>

<script>
"use strict";

const $ = id => document.getElementById(id);
// Sistema de áudio: música original da partida + efeitos sonoros mais fortes.
let audioContext = null;
let masterGain = null;
let soundVolume = 1;
let soundEnabled = true;
const revealEffect = document.getElementById("revealEffect");
const backgroundMusic = document.getElementById("backgroundMusic");

function initAudio() {
  if (!audioContext) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return false;
    audioContext = new AudioCtx();
    masterGain = audioContext.createGain();
    masterGain.gain.value = soundEnabled ? soundVolume : 0;
    masterGain.connect(audioContext.destination);
  }
  if (audioContext.state === "suspended") audioContext.resume();
  return true;
}

function playTone(frequency, duration, type = "sine", volume = 0.15, endFrequency = frequency) {
  if (!soundEnabled || !initAudio()) return;
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  const now = audioContext.currentTime;
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, now);
  oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, endFrequency), now + duration);
  gain.gain.setValueAtTime(0.001, now);
  gain.gain.linearRampToValueAtTime(volume, now + Math.min(0.08, duration / 3));
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
  oscillator.connect(gain); gain.connect(masterGain);
  oscillator.start(now); oscillator.stop(now + duration + 0.04);
}

function playCinematicFallback() {
  // Efeito grave sintetizado de reserva caso o MP3 escolhido não esteja ao lado do HTML.
  if (!soundEnabled || !initAudio()) return;
  playTone(95, 1.15, "sawtooth", 0.22, 28);
  setTimeout(() => playTone(52, 1.65, "sine", 0.30, 24), 180);
  setTimeout(() => playTone(780, 0.16, "triangle", 0.10, 180), 220);
}

function startAmbient() {
  if (!soundEnabled || !backgroundMusic) return;
  backgroundMusic.volume = Math.min(1, soundVolume * 0.42);
  const playback = backgroundMusic.play();
  if (playback && typeof playback.catch === "function") playback.catch(() => {});
}
function stopAmbient() {
  if (backgroundMusic) { backgroundMusic.pause(); backgroundMusic.currentTime = 0; }
  if (revealEffect) { revealEffect.pause(); revealEffect.currentTime = 0; }
}

function playSound(eventName) {
  if (!soundEnabled) return;
  if (eventName === "reveal") {
    if (revealEffect) {
      revealEffect.volume = soundVolume;
      revealEffect.currentTime = 0;
      const playback = revealEffect.play();
      if (playback && typeof playback.catch === "function") playback.catch(playCinematicFallback);
      return;
    }
    playCinematicFallback(); return;
  }
  if (eventName === "card") { playTone(440, 0.12, "sine", 0.14); setTimeout(() => playTone(330, 0.2, "sine", 0.11), 90); }
  if (eventName === "vote") playTone(520, 0.09, "triangle", 0.13);
  if (eventName === "suspense") { playTone(75, 0.85, "sawtooth", 0.13, 38); setTimeout(() => playTone(58, 1.0, "sine", 0.14, 30), 300); }
  if (eventName === "win") { playTone(392, 0.2, "sine", 0.13); setTimeout(() => playTone(523, 0.3, "sine", 0.13), 180); setTimeout(() => playTone(659, 0.45, "sine", 0.13), 360); }
  if (eventName === "lose") { playTone(220, 0.3, "triangle", 0.13); setTimeout(() => playTone(165, 0.5, "triangle", 0.13), 220); }
}

function updateSoundButton() {
  const button = $("soundToggle");
  if (button) button.textContent = soundEnabled ? "🔊 Efeitos ligados" : "🔇 Efeitos desligados";
}

$("soundToggle").addEventListener("click", () => {
  soundEnabled = !soundEnabled;
  if (soundEnabled) { initAudio(); startAmbient(); } else stopAmbient();
  if (initAudio() && masterGain) masterGain.gain.setTargetAtTime(soundEnabled ? soundVolume : 0, audioContext.currentTime, 0.03);
  updateSoundButton();
});

$("soundVolume").addEventListener("input", event => {
  soundVolume = Number(event.target.value) / 100;
  $("volumeValue").textContent = `${event.target.value}%`;
  if (revealEffect) revealEffect.volume = Math.min(1, soundVolume);
  if (backgroundMusic) backgroundMusic.volume = Math.min(1, soundVolume * 0.42);
  if (initAudio() && masterGain) masterGain.gain.setTargetAtTime(soundEnabled ? soundVolume : 0, audioContext.currentTime, 0.03);
});

function getQuestionGroup() {
  const category = String(game?.secret?.category || "").toLocaleLowerCase("pt-BR");
  if (/mistério|investiga|acontecimento|fenômeno|caso inexplicável|conflito|enigma|operação secreta|experimento|incidente|desaparecimento|anomalia|descoberta|fraude|paradoxo/.test(category)) return "caso";
  if (/animal/.test(category)) return "animais";
  if (/comida|alimento|culin|fruta|bebida/.test(category)) return "comidas";
  if (/objeto|utensílio|ferramenta/.test(category)) return "objetos";
  if (/lugar|local|cidade|geografia/.test(category)) return "lugares";
  if (/natureza|clima|ambiente/.test(category)) return "natureza";
  if (/profiss|trabalho|carreira/.test(category)) return "profissoes";
  if (/ciência|ciencia|conceito|termo|ideia/.test(category)) return "ciencia";
  if (/palavra|vocabulário|vocabul|conceitos/.test(category)) return "palavras";
  if (/esporte|arte|atividade física/.test(category)) return "esportes";
  if (/tecnologia|informática|digital/.test(category)) return "tecnologia";
  if (/casa|doméstico|domestico/.test(category)) return "casa";
  if (/história|historia|cultura|mitologia|literatura/.test(category)) return "historia";
  return "geral";
}

function drawQuestion() {
  const group = getQuestionGroup();
  const questions = CONTEXT_QUESTIONS[group] || CONTEXT_QUESTIONS.geral;
  if (!game.usedQuestions) game.usedQuestions = [];
  let available = questions.map((_, index) => index).filter(index => !game.usedQuestions.includes(`${group}:${index}`));
  if (!available.length) {
    game.usedQuestions = game.usedQuestions.filter(key => !String(key).startsWith(`${group}:`));
    available = questions.map((_, index) => index);
  }
  const index = available[randomInt(available.length)];
  game.usedQuestions.push(`${group}:${index}`);
  game.currentQuestion = questions[index];
}

function stopQuestionTimer() {

  stopQuestionTimer();
  timerRemaining=QUESTION_TIMER_SECONDS;

  updateQuestionTimerDisplay();

function startQuestionTimer() {
  if(timerRunning || timerRemaining<=0) return;
  timerRunning=true;
  timerInterval=setInterval(()=>{
    if(timerRemaining>0) timerRemaining--;
    if(timerRemaining<=0) {
      timerRemaining=0;
      stopQuestionTimer();
      playSound("lose");
    }
    updateQuestionTimerDisplay();
  },1000);
  updateQuestionTimerDisplay();
}
function updateQuestionTimerDisplay() {
  const display=$("timerDisplay");
  const status=$("timerStatus");
  const toggle=$("timerToggle");
  if(!display) return;
  const minutes=Math.floor(timerRemaining/60).toString().padStart(2,"0");
  const seconds=(timerRemaining%60).toString().padStart(2,"0");
  display.textContent=`${minutes}:${seconds}`;
  display.classList.toggle("time-up",timerRemaining===0);
  if(status) status.textContent=timerRemaining===0?"⏰ Tempo esgotado!":timerRunning?"Cronômetro em andamento":"Cronômetro pausado";

}

function maxImpostorsFor(count) {
  if (count >= 3 && count <= 4) return 1;
  if (count >= 5 && count <= 6) return 2;
  if (count >= 7 && count <= 10) return 3;
  return 0;
}

// Sorteio criptograficamente forte quando o navegador oferece Web Crypto.
function randomInt(max) {
  if (max <= 1) return 0;
  if (globalThis.crypto && crypto.getRandomValues) {
    const range = 0x100000000;
    const limit = range - (range % max);
    const buf = new Uint32Array(1);
    let value;
    do { crypto.getRandomValues(buf); value = buf[0]; } while (value >= limit);
    return value % max;
  }
  return Math.floor(Math.random() * max);
}

function shuffle(array) {
  const result = [...array];
  for (let i=result.length-1; i>0; i--) {
    const j=randomInt(i+1);
    [result[i],result[j]]=[result[j],result[i]];
  }
  return result;
}

function rememberSecret(secret) {
  const key=secret.toLocaleLowerCase("pt-BR");
  if (recentSecrets.includes(key)) return false;
  recentSecrets.push(key);
  if (recentSecrets.length>RECENT_SECRET_LIMIT) recentSecrets.shift();
  return true;
}

function buildWordContent(level) {
  const key=level==="Normal"?"normal":level==="Difícil"?"dificil":"muito";
  const groups=WORDS[key];
  let secret="", category="";
  for(let attempt=0;attempt<100;attempt++) {
    const group=pick(groups);
    category=group[0];
    secret=pick(group.slice(1));
    if(rememberSecret(`${key}:${secret}`)) break;
  }
  // Palavras inventadas, mas pronunciáveis, ampliam o repertório da dificuldade máxima.
  if(key==="muito" && randomInt(4)===0) {
    const rootsA=["crono","neuro","astro","cripto","lito","somno","piro","aero","hidro","xeno","meta","equi","nexo","voro","eco","lumi","oni","proto","nano","retro"];
    const rootsB=["vórtice","gênese","glifo","nômico","lúmen","fagia","mancia","fobia","dromo","plasma","cinese","ciclo","morfose","tropia","fônico","sfera","grafia","lítico","doxía","nexo"];
    secret=pick(rootsA)+pick(rootsB);
    category="Conceito inventado";
    rememberSecret(`inventado:${secret}`);
  }
  const easyClues=["É algo que pode ser nomeado.","A palavra tem um significado específico.","Pense no contexto em que isso aparece.","Pode ser reconhecido por suas características."];
  return {category,secret,clue:pick(easyClues),hints:[]};
}

function buildCaseContent(level) {
  const templates=[
    () => `${pick(CASE_PARTS.people)} encontra ${pick(CASE_PARTS.objects)} ${pick(CASE_PARTS.events)} ${pick(CASE_PARTS.places)}, ${pick(CASE_PARTS.twists)}.`,
    () => `O caso de ${pick(CASE_PARTS.objects)} que ${pick(CASE_PARTS.events)} ${pick(CASE_PARTS.places)}, ${pick(CASE_PARTS.twists)}.`,
    () => `${pick(CASE_PARTS.people)} precisa investigar por que ${pick(CASE_PARTS.objects)} ${pick(CASE_PARTS.events)} ${pick(CASE_PARTS.places)}, ${pick(CASE_PARTS.twists)}.`,
    () => `Uma operação chamada "${pick(["Espelho Cego","Horizonte Zero","Projeto Oráculo","Relógio de Vidro","Arquivo Fantasma","Protocolo Eclipse","Labirinto Azul","Sinal de Ninguém","Última Testemunha","Quarto Silencioso","Operação Prisma","Código Nébula","Ponto Cego","Vigília","Janela 13","Eco Invertido"])}" começa quando ${pick(CASE_PARTS.objects)} ${pick(CASE_PARTS.events)} ${pick(CASE_PARTS.places)}, ${pick(CASE_PARTS.twists)}.`
  ];
  let secret="";
  for(let attempt=0;attempt<100;attempt++) {
    secret=pick(templates)();
    if(rememberSecret(`caso:${secret}`)) break;
  }
  const category=pick(CASE_PARTS.categories);
  // Pistas temáticas e individuais: cada jogador recebe uma diferente.
  const clues=[
    `O caso envolve ${pick(["uma falha nos registros","uma testemunha pouco confiável","um objeto fora do lugar","um padrão que se repete","uma informação contraditória","um intervalo de tempo suspeito","uma identidade incerta","uma regra que ninguém conhecia"])}`,
    `Preste atenção em ${pick(["quem teve acesso ao local","a ordem dos acontecimentos","o detalhe que todos ignoraram","o que não aparece nas gravações","a diferença entre relato e evidência","o momento em que tudo mudou","a origem da primeira informação","quem se beneficia da confusão"])}`,
    `Uma hipótese importante é que ${pick(["a explicação mais óbvia esteja errada","duas versões contenham parte da verdade","o problema tenha começado antes de ser percebido","alguém conheça um detalhe impossível","o registro tenha sido alterado","o acaso não explique todos os fatos","o motivo seja diferente da aparência","a pista principal seja uma ausência"])}`,
    `O cenário principal é ${pick(CASE_PARTS.places)}.`,
    `Um elemento importante do caso é ${pick(CASE_PARTS.objects)}.`,
    `A investigação depende de esclarecer ${pick(["a sequência exata dos fatos","a origem de uma mensagem","uma diferença entre cópias","um álibi aparentemente perfeito","uma lembrança compartilhada","um acesso não autorizado","uma previsão registrada antes do evento","uma contradição entre testemunhas"])}`,
    `O acontecimento central parece ${pick(["impossível, mas deixou evidências","comum até ser analisado de perto","planejado, embora não haja autor conhecido","isolado, mas afeta várias pessoas","resolvido, apesar de uma pergunta sem resposta","aleatório, mas segue um padrão"])}`,
    `A pista mais útil pode estar em ${pick(["um horário","uma palavra repetida","uma ausência","um objeto comum","uma mudança pequena","uma testemunha secundária","um registro antigo","uma sequência numérica"])}`,
    `Há uma ligação inesperada entre ${pick(CASE_PARTS.objects)} e ${pick(CASE_PARTS.places)}.`,
    `Não confunda ${pick(["o motivo com a consequência","a primeira versão com a verdadeira","uma coincidência com uma prova","o suspeito com o responsável","o que foi visto com o que realmente ocorreu","a ausência de prova com uma prova de ausência"])}`,
    `A categoria geral deste caso é ${category.toLowerCase()}, mas isso não revela sua solução.`
  ];
  const shuffled=shuffle(clues);
  return {category,secret,clue:shuffled[0],hints:shuffled};
}

function getContentForLevel(level) {
  if(level==="Normal" || level==="Difícil" || level==="Muito difícil") return buildWordContent(level);
  return buildCaseContent(level);
}

function updateSetup() {
  const names=$("names").value.split("\n").map(n=>n.trim()).filter(Boolean);
  $("playerCount").textContent=`${names.length} ${names.length===1?"jogador":"jogadores"}`;

  const max=maxImpostorsFor(names.length);
  const select=$("impostorCount");
  const previous=Number(select.value)||1;
  select.innerHTML="";

  for(let i=1;i<=Math.max(1,max);i++) {
    const option=document.createElement("option");
    option.value=String(i);
    option.textContent=`${i} ${i===1?"impostor":"impostores"}`;
    select.appendChild(option);
  }

  select.value=String(Math.min(previous,Math.max(1,max)));
  $("impostorHelp").textContent=names.length<3
    ?"Adicione pelo menos 3 jogadores."
    :names.length>10
      ?"O limite é de 10 jogadores."
      :`Com ${names.length} jogadores, o máximo é ${max} ${max===1?"impostor":"impostores"}.`;
}

function startGame() {
  const names=$("names").value.split("\n").map(n=>n.trim()).filter(Boolean);

  if(names.length<3||names.length>10) {
    alert("A partida precisa de 3 a 10 jogadores."); return;
  }
  if(new Set(names.map(n=>n.toLocaleLowerCase("pt-BR"))).size!==names.length) {
    alert("Existem nomes repetidos. Corrija antes de iniciar."); return;
  }

  const impostorCount=Number($("impostorCount").value);
  const max=maxImpostorsFor(names.length);

  if(!Number.isInteger(impostorCount)||impostorCount<1||impostorCount>max||impostorCount>=names.length) {
    alert(`Com ${names.length} jogadores, o máximo permitido é ${max} ${max===1?"impostor":"impostores"}.`);
    return;
  }

  const selected=getContentForLevel($("level").value);
  const impostorIndices=new Set(
    shuffle(names.map((_,index)=>index)).slice(0,impostorCount)
  );
  const mentalista=$("level").value==="Mentalista";
  const caseMode=["Mestre","Mentalista"].includes($("level").value);
  const playerClues=shuffle([...selected.hints]);

  game={
    secret:selected,
    level:$("level").value,
    impostorCount,
    players:names.map((name,index)=>({
      name,index,
      role:impostorIndices.has(index)?"impostor":"investigador",
      alive:true,
      clue:playerClues[index] || selected.clue
    })),
    dealIndex:0,
    phase:"deal",
    tieCandidates:null,
    lastResult:null,
    eliminatedInvestigators:0,
    usedQuestions:[],
    currentQuestion:null
  };

  stopQuestionTimer();
  votes={};currentVoterIndex=0;roundNumber=1;timerRemaining=QUESTION_TIMER_SECONDS;timerRound=0;
  if (soundEnabled) { initAudio(); startAmbient(); }
  render();
}

function render() {
  if(!game) return renderSetup();
  if(game.phase==="deal") renderDeal();

}

  const active=game.players.filter(p=>p.alive);

function eligibleCandidates(voter) {
  let candidates=game.players.filter(p=>p.alive&&p.index!==voter.index);
  if(game.tieCandidates) {
    candidates=candidates.filter(p=>game.tieCandidates.includes(p.index));
  }
  return candidates;
}

function renderVoting() {
  const active=game.players.filter(p=>p.alive);

  while(currentVoterIndex<active.length&&votes[active[currentVoterIndex].index]!==undefined) {
    currentVoterIndex++;
  }

  if(currentVoterIndex>=active.length) {
    calculateVotes();return;
  }

  const voter=active[currentVoterIndex];
  const candidates=eligibleCandidates(voter);

  $("gameContent").innerHTML=`
    ${cancelButton()}
    <section class="panel">
      <span class="badge">🗳️ FASE 3 · VOTAÇÃO · RODADA ${roundNumber}</span>
      <h2>Voto de ${escapeHTML(voter.name)}</h2>
      <p class="muted">Entregue o celular a essa pessoa. Escolha em quem ela vota e confirme.</p>
      <div class="notice">Votos registrados: ${Object.keys(votes).length} de ${active.length}</div>
      <div>
        ${candidates.length?candidates.map(p=>`
          <label class="vote-row">
            <span>${escapeHTML(p.name)}</span>
            <input type="radio" name="target" value="${p.index}">
          </label>`).join(""):`<p class="muted">Não há candidatos válidos para este voto.</p>`}
      </div>
      <button class="primary" id="confirmVote" ${candidates.length?"":"disabled"}>CONFIRMAR VOTO</button>
      <button class="secondary" id="backQuestions" style="width:100%;margin-top:10px">← VOLTAR ÀS PERGUNTAS</button>
      <h3 style="margin-top:22px">Votos registrados</h3>
      <div>
        ${active.filter(p=>votes[p.index]!==undefined).map(p=>`
          <div class="player-row">
            <span>${escapeHTML(p.name)}</span>
            <span class="pill">Votou em ${escapeHTML(game.players.find(t=>t.index===votes[p.index])?.name||"—")}</span>
          </div>`).join("")||`<p class="muted">Nenhum voto registrado.</p>`}
      </div>
    </section>`;

  attachCancel();

  $("backQuestions").addEventListener("click",()=>{
    if(!confirm("Voltar às perguntas apagará todos os votos desta rodada. Os papéis, o segredo e as eliminações anteriores serão mantidos. Continuar?")) return;
    currentVoterIndex=0;
    game.phase="questions";
    render();
  });

  $("confirmVote").addEventListener("click",()=>{
    const selected=document.querySelector('input[name="target"]:checked');
    if(!selected) {
      alert("Selecione em quem deseja votar.");return;
    }

    const targetIndex=Number(selected.value);
    const target=game.players.find(p=>p.index===targetIndex);

    if(!target||!target.alive||target.index===voter.index) {
      alert("Voto inválido. Escolha um jogador ativo diferente de você.");return;
    }
    if(game.tieCandidates&&!game.tieCandidates.includes(target.index)) {
      alert("Você só pode votar nos jogadores empatados.");return;
    }

    votes[voter.index]=targetIndex;
    playSound("vote");
    currentVoterIndex++;
    render();
  });
}

function calculateVotes() {
  const tally={};
  Object.values(votes).forEach(target=>{
    tally[target]=(tally[target]||0)+1;
  });

  const entries=Object.entries(tally);

  if(!entries.length) {
    game.lastResult={type:"none",counts:tally};
    game.phase="result";
    render();
    return;
  }

  const maxVotes=Math.max(...entries.map(([,count])=>count));
  const tied=entries.filter(([,count])=>count===maxVotes).map(([index])=>Number(index));

  if(tied.length>1) {
    game.tieCandidates=tied;
    game.lastResult={type:"tie",counts:tally,candidates:tied};
    game.phase="tie";
    render();
    return;
  }

  const eliminatedIndex=tied[0];
  const eliminated=game.players.find(p=>p.index===eliminatedIndex);

  if(!eliminated||!eliminated.alive) {
    game.lastResult={type:"none",counts:tally};
    game.phase="result";
    render();
    return;
  }

  eliminated.alive=false;

  if(eliminated.role==="investigador") {
    game.eliminatedInvestigators++;
  }

  game.tieCandidates=null;
  game.lastResult={
    type:"elimination",
    counts:tally,
    eliminatedIndex,
    eliminatedName:eliminated.name,
    eliminatedRole:eliminated.role
  };

  game.gameOver=checkWinner();
  game.phase="result";
  render();
}

function checkWinner() {
  const impostorsAlive=game.players.filter(p=>p.alive&&p.role==="impostor").length;

  return impostorsAlive===0 ||
    game.eliminatedInvestigators>=game.impostorCount;
}

function renderResult() {
  const result=game.lastResult;
  const eliminated=game.players.find(p=>p.index===result.eliminatedIndex);

  $("gameContent").innerHTML=`
    ${cancelButton()}
    <section class="panel">
      <span class="badge">📣 RESULTADO DA VOTAÇÃO</span>
      <h2>${result.type==="none"?"Nenhum voto válido":escapeHTML(result.eliminatedName)+" foi eliminado"}</h2>
      <p class="muted">${eliminated
        ?"Revele o papel para todos depois de concluírem a votação."
        :"Nenhum jogador foi eliminado. A partida pode continuar."}</p>
      <div id="roleReveal" class="card-secret hidden">
        <div class="reveal-intro" id="revealIntro">A VERDADE ESTÁ PRESTES A APARECER...</div>
        <div class="secret reveal-role-text">${eliminated?.role==="impostor"?"🕶️ ERA IMPOSTOR":"🔎 ERA INVESTIGADOR"}</div>
        <p class="reveal-role-text">${escapeHTML(result.eliminatedName||"")} ${eliminated?.role==="impostor"?"era um impostor!":"era um investigador."}</p>
      </div>
      <button class="primary" id="revealRole" ${eliminated?"":"disabled"}>🎬 INICIAR REVELAÇÃO</button>
      <button class="secondary" id="continueGame" ${eliminated?"disabled":""} style="width:100%;margin-top:10px">CONTINUAR PARTIDA</button>
    </section>
    <section class="panel">
      <h3>Contagem dos votos</h3>
      ${Object.entries(result.counts).map(([index,count])=>`
        <div class="player-row">
          <span>${escapeHTML(game.players.find(p=>p.index===Number(index))?.name||"Jogador")}</span>
          <span class="pill">${count} ${count===1?"voto":"votos"}</span>
        </div>`).join("")||`<p class="muted">Nenhum voto foi registrado.</p>`}
    </section>`;

  attachCancel();

  if(eliminated) {
    $("revealRole").addEventListener("click",()=>{
      const reveal=$("roleReveal");
      const revealButton=$("revealRole");
      reveal.classList.remove("hidden");
      revealButton.disabled=true;
      revealButton.textContent="⏳ REVELANDO...";
      playSound("suspense");
      setTimeout(()=>{
        $("revealIntro").textContent="O PAPEL ERA...";
        reveal.classList.add("revealed");
        playSound("reveal");
        revealButton.textContent="✓ PAPEL REVELADO";
        $("continueGame").disabled=false;
      },1700);
    });
  }

  $("continueGame").addEventListener("click",()=>{
    if(game.gameOver) {
      game.phase="end";
      render();
      return;
    }
    roundNumber++;
    game.phase="questions";
    game.currentQuestion=null;
    resetQuestionTimer();
    votes={};
    currentVoterIndex=0;
    render();
  });
}

function renderTie() {
  const names=game.lastResult.candidates.map(index=>
    game.players.find(p=>p.index===index)?.name||"Jogador"
  );

  $("gameContent").innerHTML=`
    ${cancelButton()}
    <section class="panel">
      <span class="badge">🤝 EMPATE</span>
      <h2>A votação empatou!</h2>
      <p class="muted">Ninguém será eliminado nesta rodada. Conversem novamente e votem apenas nos jogadores empatados.</p>
      <div class="notice">${names.map(escapeHTML).join(", ")}</div>
      <button class="primary" id="newDiscussion">NOVA RODADA DE PERGUNTAS</button>
      <button class="secondary" id="newVote" style="width:100%;margin-top:10px">VOTAR NOVAMENTE AGORA</button>
    </section>`;

  attachCancel();

  $("newDiscussion").addEventListener("click",()=>{
    roundNumber++;
    resetQuestionTimer();
    game.phase="questions";
    game.currentQuestion=null;
    votes={};
    currentVoterIndex=0;
    render();
  });

  $("newVote").addEventListener("click",()=>{
    stopQuestionTimer();
    roundNumber++;
    votes={};
    currentVoterIndex=0;
    game.phase="voting";
    render();
  });
}

function renderEnd() {
  const impostors=game.players.filter(p=>p.role==="impostor");
  const impostorsAlive=impostors.filter(p=>p.alive).length;
  const investigatorsWon=impostorsAlive===0;

  $("gameContent").innerHTML=`
    <section class="panel" style="text-align:center">
      <div style="font-size:55px">${investigatorsWon?"🏆":"🕶️"}</div>
      <span class="badge">FIM DE JOGO</span>
      <h2>${investigatorsWon?"Os investigadores venceram!":"Os impostores venceram!"}</h2>
      <p class="muted">${investigatorsWon
        ?"Todos os impostores foram eliminados."
        :"O número de investigadores eliminados chegou ao número de impostores escolhidos no início."}</p>
      <div class="notice">
        <strong>Conteúdo secreto</strong><br>${escapeHTML(game.secret.secret)}<br><br>
        ${game.level!=="Mentalista"
          ?`<strong>Categoria</strong><br>${escapeHTML(game.secret.category)}<br><br>`
          :""}
        <strong>Impostores</strong><br>${impostors.map(p=>escapeHTML(p.name)).join(", ")}
      </div>
      <h3>Todos os papéis</h3>
      ${game.players.map(p=>`
        <div class="player-row">
          <span>${escapeHTML(p.name)}${p.alive?"":" (eliminado)"}</span>
          <span class="pill">${p.role==="impostor"?"Impostor":"Investigador"}</span>
        </div>`).join("")}
      <button class="primary" id="playAgain">🔄 NOVA PARTIDA</button>
      <button class="danger" id="cancelGame" style="width:100%;margin-top:10px">✕ ENCERRAR E VOLTAR AO INÍCIO</button>
    </section>`;

  $("playAgain").addEventListener("click",()=>{
    stopQuestionTimer();
    timerRemaining=QUESTION_TIMER_SECONDS;timerRound=0;
    game=null;
    votes={};
    currentVoterIndex=0;
    roundNumber=1;
    renderSetup();
  });

  $("cancelGame").addEventListener("click",cancelGame);
}

renderSetup();
</script>
</body>
