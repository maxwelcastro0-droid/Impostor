<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#100d1c"><meta name="description" content="Jogo presencial de mistério e dedução social."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Quem é o Impostor?</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#100d1c;color:#f4f0ff;font:16px system-ui,sans-serif}header{text-align:center;padding:27px 16px 22px;background:radial-gradient(ellipse at 50% 0%,#50308c,#211636 52%,#100d1c);border-bottom:1px solid #3b2c53}.logo{width:60px;height:60px;border-radius:18px;background:#33224e;border:1px solid #7654a8;display:grid;place-items:center;font-size:30px;margin:0 auto 10px}h1{font-size:23px;letter-spacing:1px;margin:0;font-weight:900}header p{color:#c5b6dc;font-size:12px;margin:7px 0 0}.wrap{padding:14px;max-width:680px;margin:auto}.panel{background:#1b1629;border:1px solid #382b4d;border-radius:17px;padding:17px;margin-bottom:13px}.tag{display:inline-block;background:#322344;color:#d7baff;border:1px solid #594174;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800;margin-bottom:10px}h2{font-size:18px;margin:0 0 12px}p{line-height:1.5}.muted{color:#b8abc9;font-size:13px}label{display:block;font-size:13px;font-weight:750;color:#d8c9ed;margin:14px 0 6px}select,textarea{width:100%;padding:12px;border:1px solid #49375f;border-radius:11px;background:#120e1d;color:#fff;font:inherit}.btn{width:100%;padding:13px 15px;border:0;border-radius:12px;background:linear-gradient(110deg,#a77bff,#7a4de0);color:white;font-weight:800;font-size:14px;margin-top:9px;cursor:pointer}.secondary{background:#292137;border:1px solid #4b3b60;color:#eee5ff}.notice{padding:12px;border-radius:11px;background:#251b36;border:1px solid #48345e;margin:10px 0;line-height:1.5;font-size:14px}.secret{background:linear-gradient(145deg,#29203d,#171222);border:1px solid #63478b;border-radius:15px;padding:15px;margin:15px 0}.bigword{font-size:32px;font-weight:950;text-align:center;padding:22px 4px;overflow-wrap:anywhere}.center{text-align:center}.player{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;border:1px solid #3b2e4e;border-radius:11px;background:#171222;margin:7px 0}.player b{font-size:13px;text-align:right}.num{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:8px;background:#342449;color:#e2caff;font-weight:850;margin-right:7px}.step{display:flex;gap:6px;margin:12px 0}.step span{height:4px;flex:1;border-radius:8px;background:#3b304b}.step .on{background:#b28aff}.hidden{display:none!important}.success{border-color:#368f72}.danger{border-color:#b45366}hr{border:0;border-top:1px solid #3b2e4e;margin:15px 0}</style></head>
<body><header><div class="logo">🕵️</div><h1>QUEM É O IMPOSTOR?</h1><p>UMA PALAVRA. SEGREDOS. QUEM ESTÁ MENTINDO?</p></header><main class="wrap"><section id="setup" class="panel"><span class="tag">NOVA PARTIDA</span><h2>Prepare sua investigação</h2><label for="count">Número de jogadores</label><select id="count"><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select><label for="imps">Número de impostores</label><select id="imps"><option value="1">1 impostor</option></select><div id="preview" class="notice"></div><label for="names">Nomes na ordem de participação</label><textarea id="names" rows="4" placeholder="Um nome por linha&#10;Ana&#10;Pedro&#10;Lucas"></textarea><p class="muted">A ordem dos nomes define a ordem das votações. Os papéis são sorteados separadamente.</p><button class="btn" id="create">🎲 Sortear papéis</button></section><section id="game" class="hidden"></section></main>
<script>
const $=id=>document.getElementById(id);
const cats={"Lugares":["Hospital","Aeroporto","Escola","Praia","Supermercado","Cinema","Restaurante","Biblioteca","Estádio","Museu","Delegacia","Parque de diversões"],"Comidas":["Pizza","Hambúrguer","Sushi","Lasanha","Pipoca","Brigadeiro","Coxinha","Panqueca","Sorvete","Pastel","Feijoada","Bolo"],"Animais":["Leão","Golfinho","Tartaruga","Pinguim","Cachorro","Gato","Girafa","Tubarão","Macaco","Águia","Crocodilo","Coelho"],"Objetos":["Celular","Guarda-chuva","Relógio","Mochila","Espelho","Lanterna","Tesoura","Controle remoto","Óculos","Ventilador","Teclado","Câmera"],"Profissões":["Médico","Professor","Bombeiro","Cientista","Chef","Piloto","Detetive","Arquiteto","Veterinário","Astronauta","Jornalista","Engenheiro"],"Transportes":["Avião","Bicicleta","Ônibus","Trem","Navio","Helicóptero","Motocicleta","Submarino","Trator","Patinete","Foguete","Táxi"],"Natureza":["Vulcão","Cachoeira","Floresta","Deserto","Arco-íris","Tempestade","Montanha","Oceano","Geleira","Ilha","Caverna","Aurora boreal"],"Esportes":["Futebol","Basquete","Vôlei","Tênis","Natação","Boxe","Skate","Ginástica","Surfe","Corrida","Handebol","Ciclismo"],"Tecnologia":["Robô","Computador","Drone","Impressora 3D","Satélite","Videogame","Inteligência artificial","Realidade virtual","Impressora","Tablet","Bateria","Projetor"]};
let g=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const maxI=n=>n<=4?1:n<=6?2:3;const limit=()=>g.n===3?1:4;const active=()=>g.players.map((p,i)=>p.active?i:-1).filter(i=>i>=0);const tally=()=>{let c={};Object.values(g.votes).forEach(i=>c[i]=(c[i]||0)+1);return c};
function update(){let n=+$('count').value,old=+$('imps').value||1;$('imps').innerHTML=Array.from({length:maxI(n)},(_,i)=>`<option value="${i+1}">${i+1} impostor${i?'es':''}</option>`).join('');$('imps').value=Math.min(old,maxI(n));$('preview').textContent=n==3?'Partida especial: 1 impostor e 1 votação válida; empate não conta e a votação se repete.':'Até 4 rodadas válidas. Empates não contam. Os investigadores podem eliminar por engano no máximo 1 investigador.'}
$('count').onchange=update;update();
function start(){let n=+$('count').value,ni=+$('imps').value,typed=$('names').value.split(/\n/).map(x=>x.trim()).filter(Boolean),names=Array.from({length:n},(_,i)=>typed[i]||`Jogador ${i+1}`),roles=shuffle(Array.from({length:n},(_,i)=>i<ni?'impostor':'investigador')),cat=Object.keys(cats),category=cat[Math.floor(Math.random()*cat.length)];g={n,ni,players:names.map((name,i)=>({name,role:roles[i],active:true})),category,word:cats[category][Math.floor(Math.random()*cats[category].length)],order:shuffle(Array.from({length:n},(_,i)=>i)),pos:0,shown:false,phase:'deal',votes:{},round:1,wrong:0,msg:'',winner:''};$('setup').classList.add('hidden');$('game').classList.remove('hidden');render()}
$('create').onclick=start;
function render(){let e=$('game');
if(g.phase==='deal'){if(g.pos>=g.n){g.phase='brief';return render()}let idx=g.order[g.pos],p=g.players[idx];e.innerHTML=`<div class="panel"><span class="tag">DISTRIBUIÇÃO SECRETA</span><div class="step">${Array.from({length:g.n},(_,i)=>`<span class="${i<g.pos?'on':''}"></span>`).join('')}</div><h2>Vez de ${esc(p.name)}</h2><p class="muted">Entregue o celular a esta pessoa. Os outros devem desviar o olhar.</p>${g.shown?`<div class="secret"><div class="center muted">SUA CARTA</div><div class="bigword">${p.role==='impostor'?'IMPOSTOR':esc(g.word)}</div><div class="center">Categoria: <b>${esc(g.category)}</b></div><p class="center muted">${p.role==='impostor'?'Você sabe a categoria, mas não a palavra. Disfarce-se!':'Memorize a palavra e não a revele diretamente.'}</p></div><button class="btn" id="hide">Entendi — esconder carta</button>`:`<button class="btn" id="show">👁 Mostrar minha carta</button>`}</div><p class="muted center">CARTA ${g.pos+1} DE ${g.n}</p>`;if($('show'))$('show').onclick=()=>{g.shown=true;render()};if($('hide'))$('hide').onclick=()=>{g.shown=false;g.pos++;render()};return}
if(g.phase==='brief'){e.innerHTML=`<div class="panel"><span class="tag">FASE DE INVESTIGAÇÃO</span><h2>Conversem e desconfiem</h2><p>💬 Façam perguntas presencialmente; o app não registra as perguntas.</p><p>🗳️ Votação aberta, seguindo a ordem cadastrada dos nomes.</p><p>⚖️ Limite de ${limit()} rodada(s) válida(s). Empates não contam.</p><button class="btn" id="go">Iniciar votação →</button></div>`;$('go').onclick=()=>{g.phase='vote';g.votes={};g.msg='';render()};return}
if(g.phase==='vote'){let ids=active(),c=tally(),next=ids.find(i=>!(i in g.votes));let html=`<div class="panel"><span class="tag">VOTAÇÃO • RODADA ${g.round}</span><h2>Quem parece ser o impostor?</h2><div class="step">${Array.from({length:limit()},(_,i)=>`<span class="${i<g.round-1?'on':''}"></span>`).join('')}</div><p class="muted">Ordem fixa de cadastro; eliminados são pulados. Cada pessoa vota uma vez e não pode votar em si mesma.</p>${g.msg?`<div class="notice">${esc(g.msg)}</div>`:''}<hr><h2>Votos registrados</h2>${Object.keys(g.votes).length?Object.keys(g.votes).sort((a,b)=>+a-(+b)).map(k=>`<div class="player"><span><span class="num">${+k+1}</span>${esc(g.players[k].name)}</span><b>→ ${esc(g.players[g.votes[k]].name)}</b></div>`).join(''):'<p class="muted">Nenhum voto ainda.</p>'}`;
if(next!==undefined)html+=`<hr><h2>Vez de ${esc(g.players[next].name)}</h2><label for="choice">Escolha um suspeito</label><select id="choice"><option value="">Selecionar jogador...</option>${ids.filter(i=>i!==next).map(i=>`<option value="${i}">${esc(g.players[i].name)}</option>`).join('')}</select><button class="btn" id="submit">Confirmar voto</button>`;
else html+=`<hr><h2>Contagem atual</h2>${ids.map(i=>`<div class="player"><span>${esc(g.players[i].name)}</span><b>${c[i]||0} voto(s)</b></div>`).join('')}<button class="btn" id="resolve">Revelar resultado</button>`;
html+='<button class="btn secondary" id="back">Voltar às perguntas</button></div>';e.innerHTML=html;if($('submit'))$('submit').onclick=()=>{let v=$('choice').value;if(v==='')return;g.votes[next]=+v;g.msg='';render()};if($('resolve'))$('resolve').onclick=resolve;$('back').onclick=()=>{g.phase='brief';g.msg='';render()};return}
if(g.phase==='between'){e.innerHTML=`<div class="panel"><span class="tag">CONTINUAR PARTIDA</span><h2>Próxima rodada de perguntas</h2><div class="notice">${esc(g.msg)}</div><p>Rodadas válidas usadas: ${g.round-1} de ${limit()}.</p><p class="muted">Papéis e palavra continuam os mesmos. Eliminados não votam.</p><button class="btn" id="next">Continuar →</button></div>`;$('next').onclick=()=>{g.phase='brief';g.msg='';render()};return}
if(g.phase==='end'){let inv=g.winner==='investigadores';e.innerHTML=`<div class="panel ${inv?'success':'danger'} center"><div style="font-size:45px"> ${inv?'🔎':'🕵️'}</div><span class="tag">PARTIDA ENCERRADA</span><h2>${inv?'Vitória dos investigadores!':'Vitória dos impostores!'}</h2><p>${esc(g.msg)}</p><hr><h2>Revelação dos papéis</h2>${g.players.map((p,i)=>`<div class="player"><span><span class="num">${i+1}</span>${esc(p.name)}${p.active?'':' · eliminado'}</span><b>${p.role==='impostor'?'🟥 IMPOSTOR':'🔎 Investigador'}</b></div>`).join('')}<div class="secret"><div class="muted">PALAVRA SECRETA</div><div class="bigword">${esc(g.word)}</div>Categoria: ${esc(g.category)}</div><button class="btn" id="again">Jogar novamente</button><button class="btn secondary" id="home">Voltar ao início</button></div>`;$('again').onclick=start;$('home').onclick=()=>{$('game').classList.add('hidden');$('setup').classList.remove('hidden');g=null}}
function resolve(){let c=tally(),ids=active(),max=Math.max(...ids.map(i=>c[i]||0)),leaders=ids.filter(i=>(c[i]||0)===max);if(leaders.length!==1){g.msg='EMPATE! Ninguém é eliminado. Esta votação não conta como rodada. Façam novas perguntas e votem novamente.';g.votes={};return render()}let p=g.players[leaders[0]];p.active=false;let used=g.round;if(p.role==='impostor'){let remaining=g.players.filter(x=>x.active&&x.role==='impostor').length;if(!remaining){g.winner='investigadores';g.msg='Todos os impostores foram identificados!';g.phase='end';return render()}if(used>=limit()){g.winner='impostores';g.msg='A última rodada válida terminou e ainda havia impostores.';g.phase='end';return render()}g.round++;g.msg=p.name+' era impostor! Ainda restam '+remaining+'.';g.votes={};g.phase='between';return render()}g.wrong++;if(g.wrong>1){g.winner='impostores';g.msg=p.name+' era investigador. Os investigadores eliminaram dois investigadores por engano.';g.phase='end';return render()}if(used>=limit()){g.winner='impostores';g.msg=p.name+' era investigador. A última rodada terminou sem encontrar todos os impostores.';g.phase='end';return render()}if(g.players.filter(x=>x.active).length<2){g.winner='impostores';g.msg='Não há jogadores suficientes para continuar e ainda há impostores.';g.phase='end';return render()}g.round++;g.msg=p.name+' era investigador. Foi o primeiro erro; os investigadores ainda podem errar uma vez.';g.votes={};g.phase='between';render()}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
